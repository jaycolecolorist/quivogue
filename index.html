<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QV fits — Seamless activewear, swim &amp; lounge, Kampala</title>
<meta name="description" content="QV fits — premium seamless and seam-fit activewear, swim and lounge wear. Sets, bras, leggings, skorts and swim, with delivery across Uganda. Showroom at THE CUBE, Kisementi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css?v=20260831165064">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
</head>
<body>

<!-- ============================================================ 1. HERO
     A rotating canvas of full-bleed photographs, copy set over the picture.
     Slides come from HERO_SLIDES in data.js. -->
<section class="hero">
  <div class="wrap">
    <div class="slideshow" id="slideshow" aria-roledescription="carousel" aria-label="QV fits campaigns">
      <div class="slideshow__track" id="slides"></div>
      <div class="slideshow__dots" id="slideDots" role="tablist" aria-label="Choose a slide"></div>
    </div>
  </div>
</section>

<!-- ============================================================ 2. AS FEATURED IN
     Hidden unless PRESS.live is true and there is something real to list. -->
<section class="section section--tight" id="pressSection" hidden>
  <div class="wrap">
    <div class="press reveal">
      <h2 class="press__title" id="pressTitle"></h2>
      <div class="press__row" id="pressRow"></div>
    </div>
  </div>
</section>

<!-- ============================================================ 3. NEW RELEASES -->
<section class="section">
  <div class="wrap">
    <div class="section-head center reveal">
      <span class="kicker">Just in</span>
      <h2>New releases</h2>
    </div>
    <div class="grid-products grid-products--four" id="newArrivals"></div>
    <p class="center" style="margin-top:34px">
      <a class="btn btn--ghost" href="shop.html?sort=new">Shop the new</a>
    </p>
  </div>
</section>

<!-- ============================================================ 4. BEST SELLERS -->
<section class="section section--tight">
  <div class="wrap">
    <div class="section-head center reveal">
      <span class="kicker">Most loved</span>
      <h2>Best sellers</h2>
    </div>
    <div class="grid-products grid-products--four" id="bestSellers"></div>
    <p class="center" style="margin-top:34px">
      <a class="btn btn--ghost" href="shop.html?badge=Bestseller">See more</a>
    </p>
  </div>
</section>

<!-- ============================================================ 5. SHOP BY MOVEMENT -->
<section class="section section--tight">
  <div class="wrap">
    <div class="section-head center reveal">
      <!-- The label is the heading now — the question came off at Jay's
           request, and the section still needs one for the outline. -->
      <h2 class="kicker">Shop by movement</h2>
    </div>
    <div class="grid-movements" id="movements"></div>
  </div>
</section>

<!-- ============================================================ 6. CAMPAIGN -->
<section class="section section--tight" id="promoSection">
  <div class="wrap">
    <article class="campaign reveal" id="campaign" hidden></article>
  </div>
</section>

<!-- ============================================================ 7. SHOP THE FEED
     The brand's own reels, autoplaying and linking through to the piece. -->
<section class="section section--tight" id="feedSection" hidden>
  <div class="wrap">
    <div class="section-head center reveal">
      <span class="kicker" id="feedKicker"></span>
      <h2 id="feedTitle"></h2>
    </div>
    <div class="grid-feed" id="feed"></div>
  </div>
</section>

<!-- ============================================================ NEWSLETTER -->
<section class="section section--tight">
  <div class="wrap">
    <div class="news reveal">
      <div class="blob blob--a" style="width:260px;height:260px;top:-90px;left:-60px;opacity:.5"></div>
      <div style="position:relative;z-index:1">
        <span class="kicker">First access</span>
        <h2>Get the drop first</h2>
        <p class="lede center">New drops and restocks. No spam — we only send when there is something to send.</p>
        <form class="news__form" id="newsForm" novalidate>
          <input type="email" id="newsEmail" placeholder="your@email.com" aria-label="Email address" required>
          <button class="btn btn--primary" type="submit">Join the list</button>
        </form>
        <p class="news__msg" id="newsMsg" role="status"></p>
      </div>
    </div>
  </div>
</section>

<script src="js/data.js?v=20260831165064"></script>
<script src="js/app.js?v=20260831165064"></script>
<script src="js/assistant.js?v=20260831165064"></script>
<script>
function pageInit() {
  initSlideshow();
  renderPress();

  /* ---------------------------------------------------- the two rows
     Both come from a curated id list in data.js. If a list is empty, or an id
     in it no longer exists, the row falls back to the badge so it is never
     left short. */
  const row = (ids, badge) => {
    const picked = (ids || []).map(getProduct).filter(Boolean);
    const rest = PRODUCTS.filter(p => p.badge === badge && !picked.includes(p));
    return [...picked, ...rest].slice(0, 4);
  };
  document.getElementById('newArrivals').innerHTML =
    row(typeof NEW_RELEASES !== 'undefined' && NEW_RELEASES, 'New').map(productCard).join('');
  document.getElementById('bestSellers').innerHTML =
    row(typeof BEST_SELLERS !== 'undefined' && BEST_SELLERS, 'Bestseller').map(productCard).join('');

  /* ---------------------------------------------------- shop by movement */
  document.getElementById('movements').innerHTML = MOVEMENTS.map(m => `
    <a class="movement reveal" href="shop.html?occasion=${encodeURIComponent(m.occasion)}">
      ${media('movement-' + m.id, m.label)}
      <span class="movement__label">${escapeHtml(m.label)}</span>
    </a>`).join('');

  /* ---------------------------------------------------- one campaign image */
  const campaign = document.getElementById('campaign');
  if (CAMPAIGN && CAMPAIGN.live) {
    campaign.hidden = false;
    campaign.innerHTML = `
      ${media('banner-campaign', CAMPAIGN.title)}
      <div class="campaign__body">
        <span class="kicker">${escapeHtml(CAMPAIGN.kicker)}</span>
        <h2>${escapeHtml(CAMPAIGN.title)}</h2>
        <a class="btn btn--primary" href="${CAMPAIGN.href}">${escapeHtml(CAMPAIGN.cta)}</a>
      </div>`;
  }
  document.getElementById('promoSection').hidden = !(CAMPAIGN && CAMPAIGN.live);

  renderFeed();

  /* ---------------------------------------------------- newsletter
     Stores locally — there is no backend, so nothing is faked. */
  document.getElementById('newsForm').addEventListener('submit', e => {
    e.preventDefault();
    const email = document.getElementById('newsEmail').value.trim();
    const msg = document.getElementById('newsMsg');
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
      msg.textContent = 'That email looks a little off — mind checking it?';
      return;
    }
    const list = JSON.parse(localStorage.getItem('qvfits.news') || '[]');
    if (!list.includes(email)) list.push(email);
    localStorage.setItem('qvfits.news', JSON.stringify(list));
    document.getElementById('newsForm').reset();
    msg.textContent = (typeof STICKER !== 'undefined' && STICKER.live)
      ? "You're on the list ✨ We'll send your 10% code before the next drop."
      : "You're on the list ✨ We'll be in touch before the next drop.";
  });
}

/* -------------------------------------------------------------- slideshow
   Auto-advances, pauses on hover and on focus, stops entirely if the visitor
   asks for reduced motion, and can be driven by the dots or the arrow keys. */
function initSlideshow() {
  const root  = document.getElementById('slideshow');
  const track = document.getElementById('slides');
  const dots  = document.getElementById('slideDots');
  // A slide marked needsSale only appears when the sale is genuinely on AND
  // something is actually reduced — a "50% off" banner over an empty rail is
  // worse than no banner at all.
  const saleOn = typeof SALE !== 'undefined' && SALE.live
                 && PRODUCTS.some(p => p.salePercent > 0);
  const list  = (typeof HERO_SLIDES !== 'undefined' ? HERO_SLIDES : [])
                  .filter(s => s && (!s.needsSale || saleOn));
  if (!list.length) { root.hidden = true; return; }

  track.innerHTML = list.map((s, i) => `
    <div class="slide" role="group"
         aria-roledescription="slide" aria-label="${i + 1} of ${list.length}"
         ${i === 0 ? '' : 'aria-hidden="true"'}>
      ${media(s.id, s.title)}
      ${s.sticker ? `<span class="slide__sticker">${escapeHtml(s.sticker)}</span>` : ''}
      <div class="slide__body">
        <span class="kicker">${escapeHtml(s.kicker)}</span>
        <${i === 0 ? 'h1' : 'h2'} class="slide__title">${escapeHtml(s.title)}</${i === 0 ? 'h1' : 'h2'}>
        <p class="lede">${escapeHtml(s.text)}</p>
        <a class="btn btn--primary btn--lg" href="${s.href}"
           ${i === 0 ? '' : 'tabindex="-1"'}>${escapeHtml(s.cta)}</a>
      </div>
    </div>`).join('');

  dots.innerHTML = list.map((s, i) => `
    <button class="slideshow__dot ${i === 0 ? 'is-on' : ''}" role="tab"
            aria-selected="${i === 0}" data-go="${i}"
            aria-label="${escapeHtml(s.title)}"></button>`).join('');

  const slides = [...track.children];
  const pips   = [...dots.children];
  let at = 0, timer = null;
  const still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // The first slide is marked active a frame late, so its push-in animates
  // like every other slide's instead of starting already settled.
  requestAnimationFrame(() => slides[0] && slides[0].classList.add('is-on'));

  /* Dip to black: the outgoing slide fades out against the black backing,
     the frame sits empty for a beat, then the new one rises out of it. */
  const DIP = 420;                       // must match the .slide transition
  let dipping = null;

  function go(n) {
    const next = (n + slides.length) % slides.length;
    if (next === at && dipping === null) return;
    at = next;

    // State that assistive tech and the dots read updates straight away.
    slides.forEach((el, i) => {
      const on = i === at;
      if (on) el.removeAttribute('aria-hidden'); else el.setAttribute('aria-hidden', 'true');
      const link = el.querySelector('a');
      if (link) link.tabIndex = on ? 0 : -1;
    });
    pips.forEach((el, i) => {
      el.classList.toggle('is-on', i === at);
      el.setAttribute('aria-selected', String(i === at));
    });

    if (still) {                          // no dip for reduced motion
      slides.forEach((el, i) => el.classList.toggle('is-on', i === at));
      return;
    }

    clearTimeout(dipping);
    slides.forEach(el => el.classList.remove('is-on'));    // down to black
    dipping = setTimeout(() => {
      slides[at].classList.add('is-on');                   // and back up
      dipping = null;
    }, DIP);
  }

  const start = () => { if (!still && !timer && slides.length > 1) timer = setInterval(() => go(at + 1), 6000); };
  const stop  = () => { clearInterval(timer); timer = null; };

  dots.addEventListener('click', e => {
    const b = e.target.closest('[data-go]');
    if (b) { go(Number(b.dataset.go)); stop(); start(); }
  });
  root.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') { go(at + 1); stop(); start(); }
    if (e.key === 'ArrowLeft')  { go(at - 1); stop(); start(); }
  });
  root.addEventListener('mouseenter', stop);
  root.addEventListener('mouseleave', start);
  root.addEventListener('focusin', stop);
  root.addEventListener('focusout', start);
  // Don't burn cycles rotating a hero nobody is looking at.
  document.addEventListener('visibilitychange', () => document.hidden ? stop() : start());
  start();
}

/* ------------------------------------------------------------------- feed
   The brand's own reels. Muted + playsinline + loop so they autoplay on a
   phone; each tile links through to the piece. A poster image stands in until
   the video can play, and on a data-saver connection the video is skipped
   entirely and the poster is all anyone downloads. */
function renderFeed() {
  const section = document.getElementById('feedSection');
  const ok = typeof SHOP_THE_FEED !== 'undefined' && SHOP_THE_FEED.live
             && SHOP_THE_FEED.items && SHOP_THE_FEED.items.length;
  section.hidden = !ok;
  if (!ok) return;

  document.getElementById('feedKicker').textContent = SHOP_THE_FEED.kicker;
  document.getElementById('feedTitle').textContent  = SHOP_THE_FEED.title;

  const conn = navigator.connection || {};
  const lite = conn.saveData === true || /^(slow-)?2g$/.test(conn.effectiveType || '');
  const v = CONFIG.assetVersion;

  document.getElementById('feed').innerHTML = SHOP_THE_FEED.items.map(it => `
    <a class="feedtile reveal" href="${it.href}" aria-label="${escapeHtml(it.label)} — shop it">
      ${lite
        ? `<img class="feedtile__media" src="photos/${it.id}.jpg?v=${v}" alt="${escapeHtml(it.label)}" loading="lazy">`
        : `<video class="feedtile__media" poster="photos/${it.id}.jpg?v=${v}"
                  muted loop playsinline preload="none"
                  aria-label="${escapeHtml(it.label)}">
             <source src="photos/${it.id}.mp4?v=${v}" type="video/mp4">
           </video>`}
      <span class="feedtile__shop" aria-hidden="true">${ICON.bag}</span>
      <span class="feedtile__label">${escapeHtml(it.label)}</span>
    </a>`).join('');

  // Only play what is actually on screen, and stop again once it scrolls off.
  const vids = [...document.querySelectorAll('.feedtile__media')].filter(e => e.tagName === 'VIDEO');
  if (!vids.length) return;
  if (!('IntersectionObserver' in window)) { vids.forEach(v2 => { v2.preload = 'auto'; v2.play().catch(() => {}); }); return; }

  const io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const el = en.target;
      if (en.isIntersecting) { el.preload = 'auto'; el.play().catch(() => {}); }
      else el.pause();
    });
  }, { threshold: 0.25 });
  vids.forEach(el => io.observe(el));
}

/* ------------------------------------------------------------------ press
   Only renders when PRESS.live is true AND there is something in it. */
function renderPress() {
  const section = document.getElementById('pressSection');
  const ok = typeof PRESS !== 'undefined' && PRESS.live && PRESS.items && PRESS.items.length;
  section.hidden = !ok;
  if (!ok) return;

  document.getElementById('pressTitle').textContent = PRESS.title;
  document.getElementById('pressRow').innerHTML = PRESS.items.map(it => {
    const inner = it.logo
      ? `<img src="photos/${it.logo}.jpg?v=${CONFIG.assetVersion}" alt="${escapeHtml(it.name)}" loading="lazy">`
      : `<span>${escapeHtml(it.name)}</span>`;
    return it.href
      ? `<a class="press__item" href="${it.href}" target="_blank" rel="noopener">${inner}</a>`
      : `<div class="press__item">${inner}</div>`;
  }).join('');
}
</script>
</body>
</html>
